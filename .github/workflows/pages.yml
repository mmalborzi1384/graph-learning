# انتشار سایت «چالش γ» در GitHub Pages
# فقط پوشه‌ی code/ منتشر می‌شود (ریشه‌ی سایت = code/index.html).
# پیش از اولین اجرا: Settings → Pages → Source را روی «GitHub Actions» بگذارید.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: بررسی کد
        uses: actions/checkout@v4
      - name: تنظیم GitHub Pages
        uses: actions/configure-pages@v5
      - name: آماده‌سازی پوشه‌ی code
        uses: actions/upload-pages-artifact@v3
        with:
          path: code
      - name: انتشار
        id: deployment
        uses: actions/deploy-pages@v4
